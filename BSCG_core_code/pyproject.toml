[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bscg-milk-yield"
version = "0.1.0"
description = "Behavioural structure-aware cross-granularity milk-yield prediction"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "torch>=2.0,<3", "tzdata>=2024.1"]

[project.scripts]
bscg = "bscg.__main__:main"

[tool.setuptools.packages.find]
include = ["bscg*"]
